name: Build iOS (arm64)

on:
  push:
    branches: [ios-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ios-build

      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config openssl@3 c-ares libssh2 expat zlib

      - name: Generate configure script
        run: |
          autoreconf -fi

      - name: Fix configure script macros
        run: |
          # Fix all ARIA2_ARG_WITH and ARIA2_ARG_WITHOUT macro calls in configure
          # Replace with equivalent shell code that does nothing (assume defaults)
          if [ -f configure ]; then
            # Fix ARIA2_ARG_WITH(name) -> shell code
            sed -i.bak 's/ARIA2_ARG_WITH(\([a-z_]*\))/if test "x$with_\1" = "x"; then with_\1=no; fi/g' configure
            # Fix ARIA2_ARG_WITHOUT(name) -> shell code  
            sed -i.bak 's/ARIA2_ARG_WITHOUT(\([a-z_]*\))/if test "x$with_\1" = "x"; then with_\1=yes; fi/g' configure
            echo "Fixed configure script"
            grep -c "ARIA2_ARG" configure || echo "No more ARIA2_ARG calls"
          fi

      - name: Configure aria2 for iOS
        run: |
          ./configure \
            --host=aarch64-apple-darwin \
            --build=$(uname -m)-apple-darwin \
            --with-openssl=$(brew --prefix openssl@3) \
            --with-libexpat=$(brew --prefix expat) \
            --with-libcares=$(brew --prefix c-ares) \
            --with-libssh2=$(brew --prefix libssh2) \
            --with-zlib=$(brew --prefix zlib) \
            --disable-nls \
            --without-gnutls \
            --without-sqlite3 \
            --without-libxml2 \
            --without-libuv \
            --disable-ftp \
            --disable-sftp \
            --disable-metalink \
            --disable-torrent \
            CFLAGS="-arch arm64 -isysroot $(xcrun -sdk iphoneos --show-sdk-path) -mios-version-min=15.0" \
            LDFLAGS="-arch arm64 -isysroot $(xcrun -sdk iphoneos --show-sdk-path) -mios-version-min=15.0"

      - name: Build
        run: make -j$(sysctl -n hw.logicalcpu)

      - name: Upload aria2c binary
        uses: actions/upload-artifact@v4
        with:
          name: aria2c-ios-arm64
          path: src/aria2c
